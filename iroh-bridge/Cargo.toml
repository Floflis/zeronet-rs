[package]
name = "zirohneth-iroh-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
publish = false
description = "Versioned JSONL bridge for ZirohNeth's native Iroh blob transport"

[[bin]]
name = "zirohneth-iroh-bridge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
iroh = "=0.35.0"
iroh-blobs = { version = "=0.35.0", features = ["fs-store", "net_protocol", "rpc"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
